name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'test/**']

permissions:
  contents: read

jobs:
  verify:
    name: JDK 8 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build pinned Easy4J dependencies with tests
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="${RUNNER_TEMP}/easy4j-dependencies"
          mkdir -p "${dependency_root}"
          while read -r dependency revision; do
            git init "${dependency_root}/${dependency}"
            git -C "${dependency_root}/${dependency}" remote add origin "https://github.com/easy-4-java/${dependency}.git"
            git -C "${dependency_root}/${dependency}" fetch --depth 1 origin "${revision}"
            git -C "${dependency_root}/${dependency}" checkout --detach FETCH_HEAD
            test "$(git -C "${dependency_root}/${dependency}" rev-parse HEAD)" = "${revision}"
            mvn -B --no-transfer-progress -f "${dependency_root}/${dependency}/pom.xml" -Dgpg.skip=true clean install
          done <<'SOURCES'
          jwt-issuer a8aab19df8ca0a703bec0d27e245e8abc67e1956
          spring-security-extension 1c58ecfbbf02b5c61efbe66b7336e29f43bac4ce
          dingtalk-sdk-extension 861032ffa1ee47090ab25f91c795b35327a03b61
          SOURCES

      - name: Verify this project
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
